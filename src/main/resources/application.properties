spring.application.name=moto-service
spring.profiles.active=${PROFILE_ACTIVE:dev}
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/changelog.yaml
spring.jpa.open-in-view=false
server.port=${PORT:7059}
springdoc.writer-with-order-by-keys=true

# Fuso de "hoje" (troca de óleo vence por data). O container roda em UTC; o usuário não.
app.timezone=${APP_TIMEZONE:America/Fortaleza}

# Paginação explícita e limitada em toda coleção (padrão do monorepo).
# serialization-mode=via_dto: contrato estável de página (content + page) em vez do JSON interno
# do PageImpl. Configurar por propriedade (e não com @EnableSpringDataWebSupport): a anotação
# explícita desliga a auto-configuração do Boot e, com ela, o max-page-size abaixo.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.serialization-mode=via_dto

introspection.uri=${INTROSPECTION_URI:http://localhost:7051/api/v1/auth/introspect}
introspection.client-id=${INTROSPECTION_CLIENT_ID:moto-service}
introspection.client-secret=${INTROSPECTION_CLIENT_SECRET:MyS3cur3Cli3ntS3cr3t!M0t0!}
